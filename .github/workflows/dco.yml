name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Le script vient de la branche de base : une pull request ne peut pas le remplacer
      # pour se valider elle-meme.
      - name: Check sign-off
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "origin/${BASE_REF}:.github/scripts/check-dco.sh" > "$RUNNER_TEMP/check-dco.sh"
          bash "$RUNNER_TEMP/check-dco.sh" "$BASE_SHA" "$HEAD_SHA"
