# ============================================================
# LorIAx : visioconférence LiveKit, enregistrement et transcription
# Complément optionnel de docker-compose.yml :
#   docker compose -f docker-compose.yml -f docker-compose.livekit.yml up -d
#
# Prérequis dans .env :
#   LIVEKIT_ENABLED=true
#   LIVEKIT_URL=wss://visio.exemple.fr   (URL WebSocket publique, jointe depuis le navigateur)
#   WHISPER_ENABLED=true                 (transcription des réunions, facultatif)
# LIVEKIT_API_KEY et LIVEKIT_API_SECRET sont générés par scripts/generate-env.sh.
#
# Ports à ouvrir sur le pare-feu : 7880/tcp (signalisation, derrière le reverse
# proxy), 7881/tcp et 50000-50050/udp (média WebRTC).
# Transcription par GPU (Voxtral) : ajouter --profile voxtral.
# ============================================================

services:
  # L'application lit les enregistrements et joint les services de transcription
  app:
    environment:
      LIVEKIT_EGRESS_PATH: /recordings
      WHISPER_API_URL: http://whisper:8000
      VOXTRAL_API_URL: http://voxtral:9001
    volumes:
      - recordings:/recordings

  # Bus de messages entre LiveKit et Egress
  livekit-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - loriax

  # Serveur SFU WebRTC. Les clés d'API viennent de LIVEKIT_KEYS, jamais du fichier de configuration.
  livekit:
    image: livekit/livekit-server:v1.13.1
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY manquant, lancer scripts/generate-env.sh}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET manquant, lancer scripts/generate-env.sh}"
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    volumes:
      - ./docker/livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
    depends_on:
      livekit-redis:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - loriax

  # Egress : enregistrement audio des réunions
  livekit-egress:
    image: livekit/egress:v1.13.0
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY manquant, lancer scripts/generate-env.sh}
        api_secret: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET manquant, lancer scripts/generate-env.sh}
        ws_url: ws://livekit:7880
        redis:
          address: livekit-redis:6379
        file_output:
          local:
            - /recordings
    volumes:
      - recordings:/recordings
    depends_on:
      livekit-redis:
        condition: service_healthy
      livekit:
        condition: service_started
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - loriax

  # Transcription audio : Faster-Whisper (Speaches), API compatible OpenAI sur CPU
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    user: "1000:1000"
    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      PRELOAD_MODELS: '["${WHISPER_MODEL:-Systran/faster-whisper-medium}"]'
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - whisper_cache:/home/ubuntu/.cache/huggingface/hub
    mem_limit: 4g
    restart: unless-stopped
    networks:
      - loriax

  # Transcription Voxtral (Mistral) via vLLM : GPU NVIDIA de 16 Go de VRAM minimum
  voxtral:
    profiles: ["voxtral"]
    build: ./docker/voxtral
    environment:
      VOXTRAL_MODEL: ${VOXTRAL_MODEL:-mistralai/Voxtral-Mini-4B-Realtime-2602}
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_PORT: "8000"
    volumes:
      - voxtral_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 24g
    restart: unless-stopped
    networks:
      - loriax

volumes:
  recordings:
  whisper_cache:
  voxtral_cache:
